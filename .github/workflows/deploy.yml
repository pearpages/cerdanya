name: Desplega a GitHub Pages

# Només es desplega amb una etiqueta v*. A mà, el workflow_dispatch també ha de triar una
# etiqueta: llançat sobre main, el build se salta i no es publica res.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un desplegament a la vegada; les tandes en cua es descarten menys l'última.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # prebuild = lint-credits: si cap imatge no té crèdit, el desplegament s'atura.
      - run: npm run build
      # Comprova dist/ abans de publicar-lo: canòniques, og:url, enllaços interns i
      # sitemap han de ser la URL on cada pàgina se serveix, no una que hi redirigeix.
      # Si es trenca, el desplegament s'atura amb l'artefacte encara sense pujar.
      - run: node scripts/check-build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
